<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mera Bistrot — Menù</title>
<meta name="theme-color" content="#F4F1EB">
<meta name="description" content="Il menù di Mera Bistrot, Via Merulana 106, Roma. Colazione, pranzo, aperitivo, pizze tonde e al taglio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#F4F1EB; --carta:#FBF9F4; --scuro:#1F5F6B; --scurissimo:#17505A;
  --inchiostro:#15282C; --tenue:#6E7E80; --riga:rgba(31,95,107,.15);
  --ottone:#B08D3F; --senape:#C9A227; --crema:#EFE7D6;
  --display:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
  --corpo:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif;
  --etichetta:'Bricolage Grotesque',sans-serif;
  --serif:'Newsreader',Georgia,serif;
  --gutter:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--inchiostro);
  font:400 16px/1.55 var(--corpo);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--scuro);outline-offset:3px}
/* senza questo, un display: esplicito batte l'attributo hidden */
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.wrap{max-width:560px;margin:0 auto;padding-inline:var(--gutter)}
.eti{font-family:var(--etichetta);font-variation-settings:'wdth' 82;
  font-weight:600;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase}

/* ── barra alta ──────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:rgba(244,241,235,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--riga)}
.top .wrap{display:flex;align-items:center;gap:10px;height:54px}
.top svg.m{width:19px;height:24px;flex:none}
.top .nome{font-weight:500;font-size:.95rem;letter-spacing:.01em}
.lang{margin-left:auto;display:flex;gap:2px;font-family:var(--etichetta);
  font-variation-settings:'wdth' 82;font-size:.7rem;font-weight:600;letter-spacing:.1em}
.lang button{background:none;border:0;padding:8px 7px;cursor:pointer;color:var(--tenue)}
.lang button[aria-pressed="true"]{color:var(--inchiostro);box-shadow:inset 0 -1.5px 0 var(--ottone)}

/* ── com'è andata (compare dopo 75 minuti) ───────────────────────────── */
.conto{display:none;background:var(--scuro);color:var(--crema)}
.conto.on{display:block;animation:scende .5s cubic-bezier(.2,.8,.2,1)}
@keyframes scende{from{transform:translateY(-10px);opacity:0}}
.conto .wrap{padding-block:16px 18px;display:grid;gap:10px}
.conto p{margin:0;font-size:1.3rem;font-weight:500;letter-spacing:-.02em}
.conto small{opacity:.72;font-size:.85rem}
.conto .r{display:flex;gap:8px;flex-wrap:wrap}
.conto a{flex:1 1 140px;text-align:center;padding:11px 12px;border-radius:999px;
  border:1px solid rgba(239,231,214,.4);color:inherit;text-decoration:none;
  font-weight:500;font-size:.88rem}
.conto a.g{background:var(--senape);border-color:var(--senape);color:var(--scurissimo)}
.conto .wrap{position:relative}
.chiudi-conto{position:absolute;top:10px;right:0;background:none;border:0;
  color:#8FB3B8;font-size:24px;line-height:1;padding:4px 8px;cursor:pointer}

/* ── apertura ────────────────────────────────────────────────────────── */
.hero{padding-block:26px 6px}
.arco{position:relative;aspect-ratio:3/3.4;border-radius:999px 999px 4px 4px;
  overflow:hidden;background:#E4DED0;box-shadow:0 28px 56px -30px rgba(21,40,44,.45)}
.arco img{width:100%;height:100%;object-fit:cover}
.arco::after{content:"";position:absolute;inset:0;border-radius:inherit;
  border:1px solid rgba(176,141,63,.55)}
.tavolo{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  background:var(--fondo);color:var(--inchiostro);padding:9px 15px;border-radius:999px;
  white-space:nowrap;font-family:var(--etichetta);font-variation-settings:'wdth' 82;
  font-weight:600;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
.tavolo b{color:var(--scuro);font-weight:600}
.nome-g{font-weight:500;font-size:clamp(2.7rem,12.5vw,3.9rem);line-height:.95;
  letter-spacing:-.04em;margin:26px 0 0;color:var(--scuro)}
.dove{margin:12px 0 0;color:var(--tenue);font-size:.95rem}
.azioni{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.azioni a,.azioni button{display:inline-flex;align-items:center;gap:8px;
  padding:10px 15px;border:1px solid var(--riga);background:var(--carta);
  color:var(--inchiostro);text-decoration:none;font-size:.86rem;font-weight:500;
  border-radius:999px;cursor:pointer}
.azioni .pri{background:var(--scuro);border-color:var(--scuro);color:var(--crema)}
.azioni svg{width:16px;height:16px;flex:none;color:var(--ottone)}
.azioni .pri svg{color:var(--senape)}

/* ── indice ──────────────────────────────────────────────────────────── */
.indice{position:sticky;top:54px;z-index:25;background:var(--fondo);
  border-bottom:1px solid var(--riga);margin-top:28px}
.indice .wrap{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;padding-block:12px}
.indice .wrap::-webkit-scrollbar{display:none}
.indice a{white-space:nowrap;text-decoration:none;color:var(--tenue);
  font-size:.88rem;font-weight:500;display:flex;gap:6px;align-items:baseline}
.indice a i{font-style:normal;font-size:.66rem;color:var(--ottone);font-weight:600}
.indice a.on{color:var(--inchiostro)}

/* ── una sezione ─────────────────────────────────────────────────────── */
.sez{padding-block:42px 6px;scroll-margin-top:106px}
.sez-h{display:flex;align-items:baseline;gap:13px;margin-bottom:8px;flex-wrap:wrap}
.sez-h .num{font-size:2.9rem;line-height:.78;font-weight:300;color:transparent;
  -webkit-text-stroke:1px var(--ottone);flex:none}
.sez-h h2{font-weight:500;font-size:1.85rem;margin:0;line-height:1;letter-spacing:-.03em;min-width:0;flex:1 1 auto}
.sez-h small{margin-left:auto;flex:none;font-family:var(--etichetta);
  font-variation-settings:'wdth' 82;font-weight:600;font-size:.62rem;
  letter-spacing:.14em;color:var(--ottone);white-space:nowrap;text-align:right}
.sez > .wrap > .nota{font-family:var(--serif);font-style:italic;font-size:.98rem;
  color:#4A5C5E;margin:4px 0 0;line-height:1.45}
.sez .foto-s{margin-top:20px;aspect-ratio:4/3.2;border-radius:999px 999px 4px 4px;
  overflow:hidden;background:#E4DED0}
.sez .foto-s img{width:100%;height:100%;object-fit:cover}

.grp{margin-top:26px}
.grp-h{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.grp-h h3{margin:0;font-size:.74rem;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;font-family:var(--etichetta);font-variation-settings:'wdth' 82;
  color:var(--scuro)}
.grp-h .tutti{margin-left:auto;font-size:.86rem;font-weight:500;color:var(--ottone);
  white-space:nowrap}

ul.voci{list-style:none;margin:0;padding:0}
ul.voci li{display:grid;grid-template-columns:1fr auto;gap:2px 16px;
  padding:13px 0;border-top:1px solid var(--riga)}
ul.voci .n{font-size:1.02rem;font-weight:400;line-height:1.25}
ul.voci .d{grid-column:1;font-family:var(--serif);font-size:.88rem;line-height:1.4;
  color:var(--tenue);margin-top:2px}
ul.voci .p{grid-row:1;grid-column:2;font-weight:500;font-size:1rem;color:var(--scuro);
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* liste lunghe (caffetteria, bevande): due colonne su schermi larghi */
ul.voci.fitto li{padding:9px 0}
ul.voci.fitto .n{font-size:.97rem}
@media(min-width:460px){ ul.voci.fitto{columns:2;column-gap:28px}
  ul.voci.fitto li{break-inside:avoid} }

/* formule: le cose che vogliamo far scegliere */
.grp.evidenza ul.voci li{background:var(--scuro);color:var(--crema);
  border:0;border-radius:16px;padding:16px 18px;margin-bottom:8px}
.grp.evidenza ul.voci .d{color:#A8C4C8}
.grp.evidenza ul.voci .p{color:var(--senape);font-size:1.5rem;font-weight:300;
  letter-spacing:-.03em}
.grp.formula ul.voci li{border:1px solid var(--ottone);border-radius:16px;
  padding:16px 18px;background:var(--carta)}
.grp.formula ul.voci .p{font-size:1.3rem;font-weight:400;letter-spacing:-.02em}

/* ── wi-fi: una targa ────────────────────────────────────────────────── */
.wifi{margin-top:48px;background:var(--scuro);color:var(--crema);border-radius:18px;
  padding:24px;position:relative;overflow:hidden;scroll-margin-top:106px}
.wifi::before{content:"";position:absolute;inset:7px;border-radius:12px;
  border:1px solid rgba(201,162,39,.55);pointer-events:none}
.wifi h2{margin:0 0 14px;font-size:1.45rem;font-weight:500;letter-spacing:-.02em;
  display:flex;align-items:center;gap:10px}
.wifi h2 svg{width:24px;color:var(--senape)}
.wifi dl{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;margin:0;align-items:baseline}
.wifi dt{font-family:var(--etichetta);font-variation-settings:'wdth' 82;font-weight:600;
  font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;opacity:.65}
.wifi dd{margin:0;font-size:1.02rem;font-weight:500}

/* ── piede ───────────────────────────────────────────────────────────── */
footer{margin-top:44px;padding-block:34px calc(104px + env(safe-area-inset-bottom));
  border-top:1px solid var(--riga)}
footer .r{display:flex;justify-content:space-between;gap:16px;padding:13px 0;
  border-bottom:1px solid var(--riga);font-size:.95rem}
footer .r span:first-child{font-family:var(--etichetta);font-variation-settings:'wdth' 82;
  font-weight:600;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ottone);padding-top:4px;flex:none}
footer .r span:last-child{text-align:right}
footer a{color:inherit}
footer .firma{margin-top:26px;text-align:center;font-family:var(--etichetta);
  font-variation-settings:'wdth' 82;font-weight:500;font-size:.6rem;letter-spacing:.2em;
  color:#A4AFAF}

/* ── barra prenota ───────────────────────────────────────────────────── */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(244,241,235,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--riga);padding:11px 0 calc(11px + env(safe-area-inset-bottom))}
.barra .wrap{display:flex;gap:9px}
.barra button,.barra a{flex:1;display:flex;align-items:center;justify-content:center;
  gap:8px;border:0;border-radius:999px;padding:14px 16px;font-size:.95rem;font-weight:500;
  cursor:pointer;text-decoration:none;background:var(--scuro);color:var(--crema)}
.barra a.sec{flex:none;width:52px;background:none;border:1px solid var(--riga);
  color:var(--scuro)}

/* ── foglio prenotazione ─────────────────────────────────────────────── */
dialog{border:0;padding:0;background:none;max-width:560px;width:100%;margin:auto auto 0}
dialog::backdrop{background:rgba(21,40,44,.55)}
.foglio{background:var(--fondo);border-radius:20px 20px 0 0;position:relative;
  padding:26px 20px calc(24px + env(safe-area-inset-bottom))}
.foglio h3{margin:0 0 4px;font-size:1.6rem;font-weight:500;letter-spacing:-.025em}
.foglio .sott{font-family:var(--serif);font-style:italic;color:var(--tenue);
  font-size:.95rem;margin:0 0 18px}
.campo{margin-bottom:13px}
.campo label{display:block;font-family:var(--etichetta);font-variation-settings:'wdth' 82;
  font-weight:600;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ottone);margin-bottom:6px}
.campo input,.campo select{width:100%;font:inherit;font-size:16px;padding:12px 14px;
  border:1px solid var(--riga);border-radius:12px;background:#fff;color:var(--inchiostro)}
.due{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chiudi{position:absolute;top:14px;right:16px;background:none;border:0;
  color:var(--tenue);font-size:26px;line-height:1;cursor:pointer}
.invia{width:100%;margin-top:6px;border:0;border-radius:999px;padding:15px;
  background:var(--scuro);color:var(--crema);font-size:.98rem;font-weight:500;cursor:pointer}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <svg class="m" viewBox="0 0 200 250" fill="none" aria-hidden="true">
      <g stroke="#1F5F6B" stroke-width="19">
        <path d="M42 206V104a58 58 0 0 1 116 0v102"/><path d="M42 104l58 52 58-52"/></g></svg>
    <span class="nome">Mera Bistrot</span>
    <div class="lang" role="group" aria-label="Lingua">
      <button data-l="it" aria-pressed="true">IT</button>
      <button data-l="en" aria-pressed="false">EN</button>
      <button data-l="es" aria-pressed="false">ES</button>
    </div>
  </div>
</header>

<div class="conto" id="conto">
  <div class="wrap">
    <button class="chiudi-conto" id="chiudi-conto" aria-label="Chiudi">&times;</button>
    <p data-t="contoT">Com'è andata?</p>
    <small data-t="contoS">Un minuto del tuo tempo ci aiuta più di quanto immagini.</small>
    <div class="r">
      <a class="g" id="l-google" href="#">Google</a>
      <a id="l-ta" href="#">TripAdvisor</a>
    </div>
  </div>
</div>

<header class="hero">
  <div class="wrap">
    <div class="arco">
      <img src="../img/w_hero.jpg" alt="L'ingresso di Mera Bistrot in Via Merulana 106">
      <div class="tavolo" id="badge-tavolo" hidden></div>
    </div>
    <h1 class="nome-g">Mera Bistrot</h1>
    <p class="dove" id="dove"></p>
    <div class="azioni">
      <button class="pri" id="apri-prenota">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span data-t="prenota">Prenota un tavolo</span></button>
      <a href="#wifi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M2 8.5a16 16 0 0 1 20 0M5.5 12.5a11 11 0 0 1 13 0M9 16.5a6 6 0 0 1 6 0"/>
          <circle cx="12" cy="20" r="1.2" fill="currentColor" stroke="none"/></svg>
        Wi-Fi</a>
      <a id="a-recensioni" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="m12 3.5 2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8Z"/></svg>
        <span data-t="recensioni">Recensioni</span></a>
    </div>
  </div>
</header>

<nav class="indice" aria-label="Sezioni"><div class="wrap" id="indice"></div></nav>

<main id="menu"></main>

<div class="wrap">
  <section class="wifi" id="wifi">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M2 8.5a16 16 0 0 1 20 0M5.5 12.5a11 11 0 0 1 13 0M9 16.5a6 6 0 0 1 6 0"/>
      <circle cx="12" cy="20" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span data-t="wifiT">Wi-Fi</span></h2>
    <dl>
      <dt data-t="rete">Rete</dt><dd id="wifi-rete"></dd>
      <dt data-t="pass">Password</dt><dd id="wifi-pass"></dd>
    </dl>
  </section>
</div>

<footer><div class="wrap">
  <div class="r"><span data-t="indirizzo">Indirizzo</span><span id="f-via"></span></div>
  <div class="r"><span data-t="orari">Orari</span><span id="f-orari"></span></div>
  <div class="r"><span data-t="telefono">Telefono</span><span><a id="f-tel" href="#"></a></span></div>
  <div class="r"><span>WhatsApp</span><span><a id="f-wa" href="#"></a></span></div>
  <div class="firma">MERA BISTROT · ROMA</div>
</div></footer>

<div class="barra"><div class="wrap">
  <button id="apri-prenota-2"><span data-t="prenota">Prenota un tavolo</span></button>
  <a class="sec" id="a-mappa" href="#" target="_blank" rel="noopener" aria-label="Mappa">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
  </a>
</div></div>

<dialog id="dlg">
  <form class="foglio" id="form-prenota">
    <button type="button" class="chiudi" id="chiudi">&times;</button>
    <h3 data-t="prenota">Prenota un tavolo</h3>
    <p class="sott" data-t="prenotaS">Confermiamo su WhatsApp, di solito in pochi minuti.</p>
    <div class="due">
      <div class="campo"><label data-t="giorno">Giorno</label><input type="date" name="data" required></div>
      <div class="campo"><label data-t="ora">Ora</label><input type="time" name="ora" value="20:00" required></div>
    </div>
    <div class="due">
      <div class="campo"><label data-t="persone">Persone</label>
        <select name="persone"><option>1</option><option selected>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option><option value="7+">7+</option></select></div>
      <div class="campo"><label data-t="nome">Nome</label><input type="text" name="nome" required></div>
    </div>
    <button class="invia" type="submit" data-t="invia">Invia su WhatsApp</button>
  </form>
</dialog>

<script src="../menu-dati.js"></script>
<script>
(function(){
  var L = 'it';
  // calcolati, non elencati: aggiungere sezioni non deve produrre 'undefined'
  function romano(n){
    var t = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']], r = '';
    t.forEach(function(c){ while(n >= c[0]){ r += c[1]; n -= c[0]; } });
    return r;
  }

  var T = {
    prenota:{it:'Prenota un tavolo', en:'Book a table', es:'Reservar una mesa'},
    prenotaS:{it:'Confermiamo su WhatsApp, di solito in pochi minuti.',
              en:'We confirm on WhatsApp, usually within minutes.',
              es:'Confirmamos por WhatsApp, normalmente en pocos minutos.'},
    recensioni:{it:'Recensioni', en:'Reviews', es:'Reseñas'},
    wifiT:{it:'Wi-Fi', en:'Wi-Fi', es:'Wi-Fi'},
    rete:{it:'Rete', en:'Network', es:'Red'},
    pass:{it:'Password', en:'Password', es:'Contraseña'},
    indirizzo:{it:'Indirizzo', en:'Address', es:'Dirección'},
    orari:{it:'Orari', en:'Hours', es:'Horario'},
    telefono:{it:'Telefono', en:'Phone', es:'Teléfono'},
    giorno:{it:'Giorno', en:'Date', es:'Día'},
    ora:{it:'Ora', en:'Time', es:'Hora'},
    persone:{it:'Persone', en:'People', es:'Personas'},
    nome:{it:'Nome', en:'Name', es:'Nombre'},
    invia:{it:'Invia su WhatsApp', en:'Send on WhatsApp', es:'Enviar por WhatsApp'},
    contoT:{it:'Com’è andata?', en:'How was it?', es:'¿Qué tal ha ido?'},
    contoS:{it:'Un minuto del tuo tempo ci aiuta più di quanto immagini.',
            en:'A minute of your time helps us more than you think.',
            es:'Un minuto de tu tiempo nos ayuda más de lo que imaginas.'},
    tavolo:{it:'Tavolo', en:'Table', es:'Mesa'}
  };
  function t(k){ return (T[k] && T[k][L]) || ''; }
  function v(o, campo){ return o[campo + L] || o[campo]; }
  // scorciatoie: n = it/en, d = dit/den
  function nome(o){ return o[L] || o.it; }
  function desc(o){ return o['d' + L] || o.dit || ''; }
  function testo(o){ if(!o) return ''; return typeof o === 'string' ? o : (o[L] || o.it); }

  /* ── numero del tavolo dal QR / NFC: ?tavolo=7 ───────────────────── */
  var tavolo = new URLSearchParams(location.search).get('tavolo');
  if(tavolo && /^\d{1,3}$/.test(tavolo)){
    var b = document.getElementById('badge-tavolo');
    b.hidden = false;
    b.innerHTML = t('tavolo') + ' <b>' + tavolo + '</b>';
  }

  /* ── costruzione del menù ────────────────────────────────────────── */
  function disegna(){
    var menu = document.getElementById('menu');
    var idx  = document.getElementById('indice');
    menu.innerHTML = ''; idx.innerHTML = '';

    SEZIONI.forEach(function(s, i){
      var a = document.createElement('a');
      a.href = '#' + s.id;
      a.innerHTML = '<i>' + romano(i + 1) + '</i>' + nome(s);
      idx.appendChild(a);

      var sec = document.createElement('section');
      sec.className = 'sez'; sec.id = s.id;
      var h = '<div class="wrap"><div class="sez-h"><span class="num">' + romano(i + 1) + '</span>' +
              '<h2>' + nome(s) + '</h2>' +
              (s.ore ? '<small>' + testo(s.ore) + '</small>' : '') + '</div>';
      if(s.nota) h += '<p class="nota">' + testo(s.nota) + '</p>';
      if(s.foto) h += '<div class="foto-s"><img loading="lazy" src="' + s.foto + '" alt=""></div>';

      s.gruppi.forEach(function(g){
        var cls = 'grp' + (g.evidenza ? ' evidenza' : '') + (g.formula ? ' formula' : '');
        h += '<div class="' + cls + '">';
        var titolo = nome(g);
        if(titolo || g.suffisso){
          h += '<div class="grp-h">' + (titolo ? '<h3>' + titolo + '</h3>' : '') +
               (g.suffisso ? '<span class="tutti">' + g.suffisso + ' &euro;</span>' : '') + '</div>';
        }
        h += '<ul class="voci' + (g.fitto ? ' fitto' : '') + '">';
        g.voci.forEach(function(x){
          var d = x['d' + L] || x.dit || '';
          h += '<li><span class="n">' + nome(x) + '</span>' +
               (x.p ? '<span class="p">' + x.p + ' &euro;</span>' : '') +
               (d ? '<span class="d">' + d + '</span>' : '') + '</li>';
        });
        h += '</ul></div>';
      });
      sec.innerHTML = h + '</div>';
      menu.appendChild(sec);
    });
    evidenziaIndice();
  }

  /* ── l'indice segue lo scorrimento ───────────────────────────────── */
  var oss;
  function evidenziaIndice(){
    if(oss) oss.disconnect();
    oss = new IntersectionObserver(function(voci){
      voci.forEach(function(e){
        if(!e.isIntersecting) return;
        document.querySelectorAll('.indice a').forEach(function(a){
          a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id);
        });
      });
    }, { rootMargin: '-110px 0px -70% 0px' });
    document.querySelectorAll('.sez').forEach(function(s){ oss.observe(s); });
  }

  /* ── lingua ──────────────────────────────────────────────────────── */
  function lingua(l){
    L = l; document.documentElement.lang = l;
    document.querySelectorAll('[data-t]').forEach(function(n){ n.textContent = t(n.dataset.t); });
    document.querySelectorAll('.lang button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.l === l));
    });
    var b = document.getElementById('badge-tavolo');
    if(!b.hidden) b.innerHTML = t('tavolo') + ' <b>' + tavolo + '</b>';
    document.getElementById('f-orari').textContent = LOCALE.orari[l];
    try{ localStorage.setItem('mera-lang', l); }catch(e){}
    disegna();
  }
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ lingua(b.dataset.l); });
  });

  /* ── dati fissi del locale ───────────────────────────────────────── */
  document.getElementById('dove').textContent = LOCALE.via;
  document.getElementById('f-via').innerHTML = LOCALE.via.replace(' · ', '<br>');
  document.getElementById('f-tel').textContent = LOCALE.telLabel;
  document.getElementById('f-tel').href = 'tel:' + LOCALE.tel;
  document.getElementById('f-wa').textContent = LOCALE.waLabel;
  document.getElementById('f-wa').href = 'https://wa.me/' + LOCALE.wa;
  // senza password la targa Wi-Fi resta nascosta: meglio niente che un segnaposto
  if(LOCALE.wifi && LOCALE.wifi.pass){
    document.getElementById('wifi-rete').textContent = LOCALE.wifi.rete;
    document.getElementById('wifi-pass').textContent = LOCALE.wifi.pass;
  } else {
    document.getElementById('wifi').hidden = true;
    var bottone = document.querySelector('.azioni a[href="#wifi"]');
    if(bottone) bottone.hidden = true;
  }
  document.getElementById('a-mappa').href = LOCALE.mappa;
  document.getElementById('a-recensioni').href = LOCALE.recensioni.google;
  document.getElementById('l-google').href = LOCALE.recensioni.google;
  document.getElementById('l-ta').href = LOCALE.recensioni.tripadvisor;

  /* ── prenotazione → WhatsApp ─────────────────────────────────────── */
  var dlg = document.getElementById('dlg');
  ['apri-prenota','apri-prenota-2'].forEach(function(id){
    var b = document.getElementById(id);   // se un pulsante non c'e', il menu
    if(b) b.addEventListener('click', function(){ dlg.showModal(); });  // deve
  });                                      // comunque disegnarsi
  document.getElementById('chiudi').addEventListener('click', function(){ dlg.close(); });
  document.getElementById('form-prenota').addEventListener('submit', function(e){
    e.preventDefault();
    var f = new FormData(e.target);
    var modelli = {
      it: 'Ciao Mera Bistrot, vorrei prenotare un tavolo per @P il @D alle @O. Nome: @N.',
      en: 'Hello Mera Bistrot, I would like to book a table for @P on @D at @O. Name: @N.',
      es: 'Hola Mera Bistrot, quisiera reservar una mesa para @P el @D a las @O. Nombre: @N.'
    };
    var msg = (modelli[L] || modelli.it)
      .replace('@P', f.get('persone')).replace('@D', f.get('data'))
      .replace('@O', f.get('ora')).replace('@N', f.get('nome'));
    window.open('https://wa.me/' + LOCALE.wa + '?text=' + encodeURIComponent(msg), '_blank');
    dlg.close();
  });

  /* ── "com'è andata": dopo 75 minuti al tavolo ────────────────────── */
  if(tavolo){
    var CHIAVE = 'mera-arrivo-' + tavolo, ora = Date.now(), arrivo;
    try{ arrivo = +localStorage.getItem(CHIAVE) || 0; }catch(e){ arrivo = 0; }
    if(!arrivo || ora - arrivo > 6 * 3600e3){
      arrivo = ora; try{ localStorage.setItem(CHIAVE, arrivo); }catch(e){}
    }
    var CHIUSA = 'mera-conto-chiuso-' + tavolo, giaChiusa = false;
    try{ giaChiusa = localStorage.getItem(CHIUSA) === String(arrivo); }catch(e){}

    function mostraConto(){
      if(giaChiusa) return;
      document.getElementById('conto').classList.add('on');
    }
    var bottoneChiudi = document.getElementById('chiudi-conto');
    if(bottoneChiudi) bottoneChiudi.addEventListener('click', function(){
      document.getElementById('conto').classList.remove('on');
      giaChiusa = true;
      // legata all'arrivo: al tavolo successivo la fascia torna
      try{ localStorage.setItem(CHIUSA, String(arrivo)); }catch(e){}
    });

    var manca = 75 * 60e3 - (ora - arrivo);
    if(manca <= 0) mostraConto();
    else if(manca < 3 * 3600e3) setTimeout(mostraConto, manca);
  }

  // ?lang=es forza la lingua: serve per linkare il menu gia' tradotto
  var chiesta = new URLSearchParams(location.search).get('lang');
  var salvata = ['it', 'en', 'es'].indexOf(chiesta) >= 0 ? chiesta : null;
  if(!salvata){ try{ salvata = localStorage.getItem('mera-lang'); }catch(e){} }
  if(!salvata){
    var sua = (navigator.language || 'it').slice(0, 2);
    salvata = ['it', 'en', 'es'].indexOf(sua) >= 0 ? sua : 'en';
  }
  lingua(salvata);
})();
</script>
</body>
</html>
